name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Roda o semantic-release em modo dry-run (calcula a versão e as notas, mas NÃO empacota, publica, taggeia nem cria release)'
        required: false
        default: true
        type: boolean

# semantic-release cria tag + GitHub Release (contents: write).
# Não há push de volta na main: a versão é computada e injetada no dotnet pack.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    name: Compute version, Pack, Push to nuget.org, Tag & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Histórico completo: semantic-release precisa de todos os commits e tags
          # para descobrir o último release e analisar os Conventional Commits desde então.
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install release toolchain
        run: npm ci

      # Gate de build/test antes de qualquer publicação (a versão real só é
      # injetada no pack feito pelo semantic-release; aqui basta validar o código).
      - name: Restore
        run: dotnet restore TecnoFisc.Sped.slnx

      - name: Build
        run: dotnet build TecnoFisc.Sped.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TecnoFisc.Sped.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      # semantic-release orquestra tudo: commit-analyzer (versão) → release-notes →
      # exec (dotnet pack -p:Version=X → dotnet nuget push) → github (tag vX + Release + assets).
      # A ordem dos plugins garante que o push ao nuget.org acontece ANTES da criação da tag:
      # se o push falhar, nenhuma tag órfã é criada e o run pode ser re-executado (--skip-duplicate).
      - name: Semantic Release (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Semantic Release (publish)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Upload packages (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nupkgs
          path: ./artifacts/*
          if-no-files-found: ignore
          retention-days: 30
