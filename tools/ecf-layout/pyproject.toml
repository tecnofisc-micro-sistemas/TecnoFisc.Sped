[project]
name = "ecf-layout"
version = "0.1.0"
description = "Local tooling for preparing the ECF layout manual"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.25.0",
    "pymupdf4llm==1.28.0",
    "pytest",
]

[project.scripts]
ecf-layout = "ecf_layout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecf_layout"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
